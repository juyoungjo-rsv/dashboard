  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: transparent;   /* 배경 없음 — 다른 영상/화면 위에 그대로 올려서 씀 */
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans KR', sans-serif;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 720px;
    padding: 0 24px;
  }

  .content {
    position: relative;
    overflow: hidden;          /* 이 높이만큼만 보이고 나머지는 위/아래로 가려짐 */
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
  }

  .track {
    display: flex;
    flex-direction: column;
    /* transition은 JS에서 붙였다 뗐다 함 (seamless loop) */
  }

  .item {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6px 0;
  }

  .caption {
    display: inline-block;
    max-width: 100%;
    white-space: nowrap;       /* 항상 한 줄로 표시 — 넘치면 JS가 글자 크기를 줄임 */
    color: #fff;
    font-weight: 700;
    font-size: 28px;
    line-height: 1.4;
    letter-spacing: -0.02em;
    text-shadow: 0 2px 10px rgba(0,0,0,0.55);   /* 배경이 없어도 어떤 화면 위에서든 잘 보이게 */
  }

  @media (max-width: 640px) {
    .caption { font-size: 20px; }
  }

  .stage { visibility: hidden; }   /* 폰트 로드 끝나면 JS가 보여줌 — 시스템 폰트로 잠깐 보였다 바뀌는 것 방지 */

    const available = content.clientWidth;
    items.forEach(el => {

      caption.style.fontSize = '';

      const natural = caption.scrollWidth;
      if (natural > available) {
        caption.style.fontSize = (base * available / natural) + 'px';
      }
    });
  }

        track.style.transition = 'none';
        track.style.transform = 'translateY(0px)';
        index = 0;
      }, SLIDE_MS);
    }
  }

  // 폰트가 완전히 로드된 뒤에 크기를 재고 화면에 보여준다 —
  // 그 전에 재면 시스템 폰트 기준으로 잘못 잰 크기가 그대로 굳어버림.
  document.fonts.ready.then(() => {
    // 마지막에 첫 캡션을 복제해서 붙여야 "끊김 없이" 순환됨
    const renderList = [...CAPTIONS, CAPTIONS[0]];
    track.innerHTML = renderList.map(text => `
      <div class="item"><div class="caption">${text}</div></div>
    `).join('');

    items = track.querySelectorAll('.item');

    // 모든 캡션은 한 줄 기준으로 박스 높이를 통일한다.
    items.forEach(el => { itemHeight = Math.max(itemHeight, el.getBoundingClientRect().height); });
    items.forEach(el => { el.style.height = itemHeight + 'px'; });
    content.style.height = itemHeight + 'px';

    fitCaptions();
    window.addEventListener('resize', fitCaptions);

    stage.style.visibility = 'visible';
    setInterval(goNext, ITEM_MS + SLIDE_MS);
  });
</script>

</body>
</html>
