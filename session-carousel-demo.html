<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caption Carousel</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: transparent;   /* 배경 없음 — 다른 영상/화면 위에 그대로 올려서 씀 */
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans KR', sans-serif;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 720px;
    padding: 0 24px;
  }

  .content {
    position: relative;
    overflow: hidden;          /* 이 높이만큼만 보이고 나머지는 위/아래로 가려짐 */
  }

  .track {
    display: flex;
    flex-direction: column;
    /* transition은 JS에서 붙였다 뗐다 함 (seamless loop) */
  }

  .item {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6px 0;
  }

  .caption {
    color: #fff;
    font-weight: 700;
    font-size: 28px;
    line-height: 1.4;
    letter-spacing: -0.01em;
    text-shadow: 0 2px 10px rgba(0,0,0,0.55);   /* 배경이 없어도 어떤 화면 위에서든 잘 보이게 */
  }

  @media (max-width: 640px) {
    .caption { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="content">
    <div class="track" id="track"></div>
  </div>
</div>

<script>
  // 자막 50개
  const CAPTIONS = [
    "주영님의 브랜드는 어떤 모습으로 기억되고 있나요?",
    "은미님, 오늘 여기 오기 전에는 무엇을 하고 계셨나요?",
    "지현님, 유명한 브랜드와 좋은 브랜드는 무엇이 다를까요?",
    "채언님, 마음속에 최애 브랜드 하나쯤 있지 않나요?",
    "지영님의 브랜드는 고객에게 어떤 감정을 남기고 있나요?",
    "동욱님, 오늘 가장 먼저 눈에 들어온 것은 무엇이었나요?",
    "상철님, 브랜드의 진짜 매력은 어디에서 드러날까요?",
    "민석님, 브랜드 덕분에 기분이 좋아졌던 순간이 있나요?",
    "주영님, 브랜드만의 이야기는 어디에서 시작될까요?",
    "은미님, 좋은 마케팅은 꼭 눈에 띄어야 할까요?",
    "지현님, 오늘 점심 식사는 어떠셨어요?",
    "채언님, '이 브랜드 참 잘한다'고 생각한 적 있나요?",
    "지영님의 브랜드를 처음 만나는 사람에게 무엇을 보여주고 싶나요?",
    "동욱님, 고객은 브랜드에서 무엇을 기억할까요?",
    "상철님, 요즘 가장 마음이 가는 브랜드가 있나요?",
    "민석님, 지금 가장 마시고 싶은 음료가 있나요?",
    "주영님의 브랜드는 예쁜 브랜드인가요, 매력적인 브랜드인가요?",
    "은미님, 브랜드 하나에 괜히 마음이 간 적 있나요?",
    "지현님의 브랜드를 한 장면으로 표현한다면 어떤 모습일까요?",
    "채언님, 오늘 이곳에서 가장 기대했던 건 무엇인가요?",
    "지영님, 모든 브랜드에 오프라인 경험이 필요할까요?",
    "동욱님, 오래도록 기억에 남아 있는 브랜드가 있나요?",
    "상철님, 사람들이 브랜드를 좋아하게 되는 순간은 언제일까요?",
    "민석님, 오늘 여기서 새로운 아이디어 하나쯤 얻어가고 싶으신가요?",
    "주영님, 나도 모르게 브랜드에 홀린 적 있나요?",
    "은미님의 브랜드는 어떤 사람에게 가장 잘 어울리나요?",
    "지현님, 고객이 기억하는 건 브랜드일까요, 경험일까요?",
    "채언님, 오시는 길이 힘들진 않으셨나요?",
    "지영님, 브랜드가 고객에게 남기고 싶은 한마디는 무엇인가요?",
    "동욱님, 최근에 '이건 참 좋다'고 느낀 경험이 있나요?",
    "상철님, 브랜드의 진정성은 어떻게 보여줄 수 있을까요?",
    "민석님, 오늘 처음 만난 사람과 인사 나눠보셨나요?",
    "주영님의 브랜드를 사람들이 이야기한다면 어떤 말을 듣고 싶나요?",
    "은미님의 브랜드에서 가장 특별한 경험은 무엇인가요?",
    "지현님, 지금 이 순간 가장 궁금한 것은 무엇인가요?",
    "채언님, 좋은 브랜드 경험은 어디에서 시작될까요?",
    "지영님, 브랜드가 고객에게 오래 남는다면 무엇 때문일까요?",
    "동욱님, 누군가에게 꼭 소개하고 싶은 브랜드가 있나요?",
    "상철님, 오늘 하루 중 가장 마음에 들었던 순간은 언제였나요?",
    "민석님의 브랜드가 오프라인에서 만난다면 어떤 모습일까요?",
    "주영님, 브랜드와 고객 사이에는 어떤 이야기가 오가고 있을까요?",
    "은미님, 브랜드를 떠올리면 어떤 장면이 생각나나요?",
    "지현님, 브랜드는 고객의 일상에 어떤 순간을 만들고 있나요?",
    "채언님, 브랜드를 경험한다는 건 무엇일까요?",
    "지영님, 오늘 집에 가서도 생각날 장면이 있을까요?",
    "동욱님의 브랜드를 선택해야 하는 이유는 무엇일까요?",
    "상철님, 브랜드의 매력은 어디에서 만들어질까요?",
    "민석님의 브랜드는 고객에게 어떤 이야기를 건네고 있나요?",
    "주영님, '이 브랜드 참 잘한다'고 생각한 적 있나요?",
  ];

  const ITEM_MS = 2600;       // 자막 하나가 머무르는 시간
  const SLIDE_MS = 550;       // 위로 슬라이드하는 데 걸리는 시간
  const SLIDE_EASE = 'cubic-bezier(0.65, 0, 0.35, 1)';

  const track = document.getElementById('track');
  const content = document.querySelector('.content');

  // 마지막에 첫 캡션을 복제해서 붙여야 "끊김 없이" 순환됨
  const renderList = [...CAPTIONS, CAPTIONS[0]];
  track.innerHTML = renderList.map(text => `
    <div class="item"><div class="caption">${text}</div></div>
  `).join('');

  const items = track.querySelectorAll('.item');

  // 자막마다 줄바꿈 길이가 달라도 슬라이드가 어긋나지 않도록,
  // 가장 높은 아이템 기준으로 모든 아이템 높이를 통일한다.
  let itemHeight = 0;
  items.forEach(el => { itemHeight = Math.max(itemHeight, el.getBoundingClientRect().height); });
  items.forEach(el => { el.style.height = itemHeight + 'px'; });
  content.style.height = itemHeight + 'px';

  let index = 0;

  function goNext() {
    index++;
    track.style.transition = `transform ${SLIDE_MS}ms ${SLIDE_EASE}`;
    track.style.transform = `translateY(-${index * itemHeight}px)`;

    if (index === CAPTIONS.length) {
      // 복제된 마지막 아이템까지 슬라이드된 직후, 트랜지션 없이 맨 앞으로 순간 이동
      setTimeout(() => {
        track.style.transition = 'none';
        track.style.transform = 'translateY(0px)';
        index = 0;
      }, SLIDE_MS);
    }
  }

  setInterval(goNext, ITEM_MS + SLIDE_MS);
</script>

</body>
</html>
