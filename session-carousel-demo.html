<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Carousel</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0715;
    font-family: 'Noto Sans KR', sans-serif;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 520px;
    height: 220px;
    border-radius: 20px;
    overflow: hidden;
    background:
      radial-gradient(120% 100% at 85% 0%, #6b3fb8 0%, transparent 55%),
      linear-gradient(135deg, #3a1f7a 0%, #241350 45%, #140a2e 100%);
  }

  .content {
    position: absolute;
    left: 28px;
    right: 28px;
    top: 50%;
    transform: translateY(-50%);
    height: 92px;              /* 아이템 한 개 높이 = 슬라이드 이동 거리 */
    overflow: hidden;
  }

  .track {
    display: flex;
    flex-direction: column;
    /* transition은 JS에서 붙였다 뗐다 함 (seamless loop) */
  }

  .item {
    height: 92px;
    flex: 0 0 92px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
  }

  .badge {
    align-self: flex-start;
    background: rgba(255,255,255,0.12);
    color: #e9e4ff;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    padding: 4px 10px;
    border-radius: 999px;
  }

  .progress-track {
    position: relative;
    width: 100%;
    height: 2px;
    background: rgba(255,255,255,0.15);
    border-radius: 999px;
  }
  .progress-fill {
    position: absolute;
    inset: 0;
    width: 0%;
    background: linear-gradient(90deg, #6ea8ff, #8f7bff);
    border-radius: 999px;
  }
  .progress-dot {
    position: absolute;
    top: 50%;
    left: 0%;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #7db3ff;
    box-shadow: 0 0 8px 2px rgba(125,179,255,0.7);
    transform: translate(-50%, -50%);
  }
  .item.is-active .progress-fill,
  .item.is-active .progress-dot {
    transition: none;
  }
  .item.animate-progress .progress-fill { animation: fillBar linear forwards; }
  .item.animate-progress .progress-dot  { animation: moveDot  linear forwards; }

  @keyframes fillBar { from { width: 0%; } to { width: 100%; } }
  @keyframes moveDot  { from { left: 0%; }  to { left: 100%; } }

  .title {
    color: #fff;
    font-weight: 700;
    font-size: 20px;
    line-height: 1.3;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  @media (max-width: 480px) {
    .title { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="content">
    <div class="track" id="track"></div>
  </div>
</div>

<script>
  // 여기에 원하는 세션 목록을 넣으세요.
  const SESSIONS = [
    { label: 'Session 1.', title: '팝업스토어, 왜 지금 주목받는가' },
    { label: 'Session 2.', title: '브랜드 경험을 설계하는 공간 기획' },
    { label: 'Session 3.', title: '성수동 로컬 큐레이터가 바라본 팝업스토어' },
    { label: 'Session 4.', title: '소비자를 홀린 팝업스토어 기획법' },
    { label: 'Session 5.', title: '오픈 이후, 데이터로 완성하는 리텐션' },
  ];

  const ITEM_MS = 3200;       // 한 세션이 머무르는 시간
  const SLIDE_MS = 650;       // 위로 슬라이드하는 데 걸리는 시간
  const SLIDE_EASE = 'cubic-bezier(0.65, 0, 0.35, 1)';

  const track = document.getElementById('track');

  // 마지막에 첫 아이템을 복제해서 붙여야 "끊김 없이" 순환됨
  const renderList = [...SESSIONS, SESSIONS[0]];
  track.innerHTML = renderList.map(s => `
    <div class="item">
      <span class="badge">${s.label}</span>
      <div class="progress-track">
        <div class="progress-fill"></div>
        <div class="progress-dot"></div>
      </div>
      <div class="title">${s.title}</div>
    </div>
  `).join('');

  const items = track.querySelectorAll('.item');
  let index = 0;

  function startProgress(i) {
    const el = items[i];
    el.classList.remove('animate-progress');
    void el.offsetWidth;              // 리플로우 강제 → 애니메이션 재시작
    el.style.setProperty('--dur', ITEM_MS + 'ms');
    el.querySelector('.progress-fill').style.animationDuration = ITEM_MS + 'ms';
    el.querySelector('.progress-dot').style.animationDuration = ITEM_MS + 'ms';
    el.classList.add('animate-progress');
  }

  function goNext() {
    index++;
    track.style.transition = `transform ${SLIDE_MS}ms ${SLIDE_EASE}`;
    track.style.transform = `translateY(-${index * 92}px)`;

    if (index === SESSIONS.length) {
      // 복제된 마지막 아이템까지 슬라이드된 직후, 트랜지션 없이 맨 앞으로 순간 이동
      setTimeout(() => {
        track.style.transition = 'none';
        track.style.transform = 'translateY(0px)';
        index = 0;
        startProgress(0);
      }, SLIDE_MS);
    } else {
      setTimeout(() => startProgress(index), SLIDE_MS);
    }
  }

  startProgress(0);
  setInterval(goNext, ITEM_MS + SLIDE_MS);
</script>

</body>
</html>
