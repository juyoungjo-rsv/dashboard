<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      padding: 20px;
      width: 320px;
    }

    .section {
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      flex: 1;
    }

    input[type="radio"] {
      margin-right: 6px;
      cursor: pointer;
    }

    label {
      cursor: pointer;
      font-size: 12px;
      color: #333;
    }

    .text-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      font-size: 12px;
      font-family: inherit;
      margin-bottom: 8px;
    }

    .text-input:focus {
      outline: none;
      border-color: #0066ff;
      box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
    }

    textarea.text-input {
      resize: vertical;
      min-height: 60px;
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
    }

    .file-input-wrapper input[type="file"] {
      position: absolute;
      left: -9999px;
    }

    .file-input-button {
      display: block;
      width: 100%;
      padding: 10px;
      background: #f5f5f5;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      color: #333;
      text-align: left;
      transition: background 0.2s;
    }

    .file-input-button:hover {
      background: #efefef;
    }

    .file-name {
      font-size: 11px;
      color: #0066ff;
      margin-top: 4px;
    }

    .generate-button {
      width: 100%;
      padding: 12px;
      background: #0066ff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 20px;
    }

    .generate-button:hover {
      background: #0052cc;
    }

    .generate-button:active {
      background: #003d99;
    }

    .generate-button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .info-text {
      font-size: 11px;
      color: #999;
      margin-top: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="section">
    <div class="section-title">그라데이션 색상</div>
    <div class="input-group">
      <div class="radio-option">
        <input type="radio" id="gradient-dark" name="gradient" value="dark" checked>
        <label for="gradient-dark">검정색</label>
      </div>
      <div class="radio-option">
        <input type="radio" id="gradient-light" name="gradient" value="light">
        <label for="gradient-light">흰색</label>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">배경 이미지</div>
    <div class="file-input-wrapper">
      <button class="file-input-button">+ 이미지 선택</button>
      <input type="file" id="background-image" accept="image/*">
    </div>
    <div id="image-name" class="file-name"></div>
  </div>

  <div class="section">
    <div class="section-title">메인 문구</div>
    <textarea
      id="main-text"
      class="text-input"
      placeholder="예: 팝업스토어 기획 방법 총정리"
    ></textarea>
  </div>

  <div class="section">
    <div class="section-title">서브 문구</div>
    <input
      type="text"
      id="sub-text"
      class="text-input"
      placeholder="예: 장소 선정부터 비용, 운영까지 실무 가이드"
    >
  </div>

  <button id="generate-button" class="generate-button">생성하기</button>

  <div class="info-text">
    💡 팁: 메인 문구는 2줄, 서브 문구는 1줄로 구성하는 것이 좋습니다.
  </div>

  <script src="ui.js"></script>
</body>
</html>
